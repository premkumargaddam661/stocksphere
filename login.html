
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StockSphere | Login</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .login-form-panel {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
        }

        .login-card h2 {
            margin-bottom: 8px;
        }

        .login-subtitle {
            margin-bottom: 28px;
            color: #9ba7b8;
        }

        .login-field {
            margin-bottom: 18px;
        }

        .login-field label {
            display: block;
            margin-bottom: 8px;
        }

        .login-field input {
            width: 100%;
            box-sizing: border-box;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 75px;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #55d6a2;
            cursor: pointer;
            font-weight: 600;
        }

        .login-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 15px 0 22px;
            gap: 10px;
        }

        .remember-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .remember-option input {
            width: auto;
        }

        .forgot-link,
        .register-link {
            color: #55d6a2;
            text-decoration: none;
            cursor: pointer;
        }

        .login-submit {
            width: 100%;
            cursor: pointer;
        }

        .login-submit:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        #loginMessage {
            min-height: 22px;
            margin-top: 16px;
            font-size: 13px;
            text-align: center;
        }

        .register-prompt {
            text-align: center;
            margin-top: 24px;
            color: #9ba7b8;
        }

        @media (max-width: 768px) {
            .login-wrapper {
                min-height: 100vh;
            }

            .login-brand-panel {
                display: none;
            }

            .login-form-panel {
                width: 100%;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <main class="login-wrapper">

        <!-- BRAND PANEL -->
        <section class="login-brand-panel">

            <div class="login-brand-content">

                <h1>StockSphere</h1>

                <p>
                    Smart Inventory Management System
                </p>

                <div class="login-brand-description">
                    Manage products, monitor inventory,
                    track stock movements and understand
                    your business with powerful analytics.
                </div>

            </div>

        </section>


        <!-- LOGIN PANEL -->
        <section class="login-form-panel">

            <div class="login-card">

                <h2>Welcome Back</h2>

                <p class="login-subtitle">
                    Sign in to access your inventory dashboard.
                </p>


                <form id="loginForm">

                    <!-- EMAIL -->
                    <div class="login-field">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="username"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->
                    <div class="login-field">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="password-toggle"
                            >
                                SHOW
                            </button>

                        </div>

                    </div>


                    <!-- LOGIN OPTIONS -->
                    <div class="login-options">

                        <label class="remember-option">

                            <input
                                type="checkbox"
                                id="remember"
                                name="remember"
                            >

                            <span>Remember me</span>

                        </label>

                        <a
                            href="#"
                            id="forgotPassword"
                            class="forgot-link"
                        >
                            Forgot password?
                        </a>

                    </div>


                    <!-- LOGIN BUTTON -->
                    <button
                        type="submit"
                        class="login-submit"
                    >
                        Sign In
                    </button>


                    <!-- LOGIN MESSAGE -->
                    <p
                        id="loginMessage"
                        role="status"
                        aria-live="polite"
                    ></p>

                </form>


                <!-- REGISTRATION -->
                <p class="register-prompt">

                    Don't have an account?

                    <a
                        href="register.html"
                        class="register-link"
                    >
                        Create Account
                    </a>

                </p>

            </div>

        </section>

    </main>


    <!-- AUTHENTICATION SCRIPT -->
    <script src="login.js?v=2"></script>

</body>
</html>
